<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MEDPRO v16.1 | Clinical Management</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEDPRO">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/2563eb/ffffff?text=MP">

    <style>
        :root {
            --primary: #2563eb; --success: #16a34a; --danger: #dc2626;
            --zinc-100: #f4f4f5; --zinc-400: #a1a1aa; --zinc-500: #71717a; --zinc-800: #27272a;
            --border: #e2e8f0; --text: #18181b;
        }

        body { 
            font-family: 'Inter', -apple-system, system-ui, sans-serif; 
            background: #fafafa; margin: 0; display: flex; color: var(--text); font-size: 13px; 
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
        }
        
        /* SIDEBAR (Desktop) */
        .sidebar { 
            width: 180px; background: var(--zinc-800); color: white; 
            height: 100vh; position: fixed; padding: 15px 0; 
            display: flex; flex-direction: column; z-index: 100; 
        }
        .sidebar h2 { padding: 0 15px; font-size: 11px; color: var(--success); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        .nav-btn { padding: 12px 15px; cursor: pointer; color: #a1a1aa; border:none; background:none; width:100%; text-align:left; font-size:12px; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: #3f3f46; color: white; }

        .main-content { margin-left: 180px; padding: 20px; width: calc(100% - 180px); box-sizing: border-box; }
        .card { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        
        /* GRID */
        .clinica-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        
        .diag-item { 
            padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; 
            cursor: pointer; display: flex; align-items: flex-start; 
            background: white; transition: all 0.2s;
        }
        .diag-item:hover { border-color: var(--primary); }
        .diag-item.active { border-color: var(--primary); border-left: 5px solid var(--primary); background: #eff6ff; }
        
        .diag-content { flex-grow: 1; overflow: hidden; }
        .diag-content strong { font-size: 13px; color: var(--zinc-800); }
        .diag-sintesi { font-size: 11px; color: var(--zinc-500); margin-top: 4px; line-height: 1.4; }

        /* BUTTONS */
        button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        .btn-view { background: var(--primary); color: white; }
        .btn-save { background: var(--zinc-800); color: white; }
        .btn-del-outline { background: transparent; color: var(--zinc-500); border: 1px solid var(--border); }

        input, textarea { font-size: 16px !important; padding: 10px; border: 1px solid var(--border); border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; }
        
        .pazienti-table { width: 100%; border-collapse: collapse; background: white; }
        .pazienti-table th { background: var(--zinc-100); text-align: left; padding: 12px; font-size: 10px; color: var(--zinc-500); text-transform: uppercase; }
        .pazienti-table td { padding: 12px; border-bottom: 1px solid #f1f1f1; }

        .item-box { background: #f8fafc; border-radius: 4px; padding: 10px; margin-bottom: 8px; position: relative; border: 1px solid var(--border); }
        .timeline-item { border-left: 2px solid var(--border); padding-left: 15px; margin-bottom: 15px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -5px; top: 0; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; backdrop-filter: blur(2px); }
        .hidden { display: none; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { 
                width: 100%; height: auto; position: sticky; top: 0; 
                flex-direction: row; padding: 10px 0; justify-content: space-around;
                padding-top: env(safe-area-inset-top);
            }
            .sidebar h2 { display: none; }
            .nav-btn { width: auto; text-align: center; padding: 10px; font-size: 11px; }
            .main-content { margin-left: 0; width: 100%; padding: 15px; }
            .clinica-grid { grid-template-columns: 1fr; }
            .pazienti-table th:first-child, .pazienti-table td:first-child { display: none; }
            .modal { align-items: flex-end; padding: 0; }
            .modal .card { border-radius: 15px 15px 0 0; max-width: 100%; }
        }

        /* PRINT STYLE - Hidden during normal use */
        #print-area { display: none; }
        @media print { 
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>MEDPRO v16</h2>
    <button class="nav-btn active" onclick="showSection('dashboard')" id="nav-dash">📋 In Cura</button>
    <button class="nav-btn" onclick="showSection('archivio')" id="nav-arch">📂 Archivio</button>
    <div style="margin-top: auto; padding: 10px;">
        <button class="btn-view" style="width: 100%; background: var(--success);" onclick="apriModalPaziente(false)">+ NUOVO</button>
    </div>
</div>

<div class="main-content">
    <!-- DASHBOARD -->
    <div id="section-dashboard">
        <h1 style="font-size: 18px; margin-bottom: 20px;">Cartelle Attive</h1>
        <div class="card" style="padding:0; overflow: hidden;">
            <table class="pazienti-table">
                <thead><tr><th>Apertura</th><th>Nominativo</th><th>Azioni</th></tr></thead>
                <tbody id="lista-attivi"></tbody>
            </table>
        </div>
    </div>

    <!-- ARCHIVIO -->
    <div id="section-archivio" class="hidden">
        <h1 style="font-size: 18px;">Archivio Storico</h1>
        <input type="text" id="cercaArchivio" placeholder="🔍 Cerca per nome o CF..." onkeyup="renderArchivio()">
        <div class="card" style="padding:0; overflow: hidden;">
            <table class="pazienti-table">
                <thead><tr><th>Nominativo</th><th>Azioni</th></tr></thead>
                <tbody id="lista-archiviati"></tbody>
            </table>
        </div>
    </div>

    <!-- CLINICA -->
    <div id="section-clinica" class="hidden">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button onclick="showSection('dashboard')" class="btn-del-outline">← TORNA ALLA LISTA</button>
            <div style="display:flex; gap:8px;">
                <button class="btn-view" style="background:var(--danger)" onclick="generaStampa()">📄 PDF / STAMPA</button>
                <button class="btn-save" id="btnSalvaTutto" onclick="salvaEChiudi()">💾 SALVA</button>
            </div>
        </div>

        <div class="card" style="border-left: 4px solid var(--zinc-800);">
            <div style="display:flex; justify-content:space-between; align-items: flex-start;">
                <div>
                    <h2 id="cli-nome" style="margin:0; font-size:19px; letter-spacing: -0.5px;">--</h2>
                    <p id="cli-info" style="margin:6px 0; color:var(--zinc-500); font-size:11px; white-space: pre-line; line-height: 1.5;"></p>
                </div>
                <button class="btn-del-outline" onclick="apriModalPaziente(true)">MODIFICA DATI</button>
            </div>
        </div>

        <div class="clinica-grid">
            <!-- Colonna Diagnosi -->
            <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0; font-size:11px; color: var(--zinc-500); text-transform: uppercase;">Diagnosi Attive</h3>
                    <button class="btn-view" style="padding:4px 10px" onclick="document.getElementById('modal-diagnosi').classList.remove('hidden')">+ AGGIUNGI</button>
                </div>
                <div id="cli-lista-diag"></div>
            </div>

            <!-- Colonna Focus Diario -->
            <div id="area-focus" class="hidden">
                <div class="card" style="border-top: 3px solid var(--primary); min-height: 400px;">
                    <h2 id="focus-titolo" style="font-size:15px; color:var(--primary); margin:0 0 20px 0; padding-bottom: 10px; border-bottom: 1px solid var(--zinc-100);">--</h2>
                    
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="font-size:12px;">PIANO TERAPEUTICO</strong>
                        <button class="btn-view" style="font-size:10px; padding:4px 8px;" onclick="document.getElementById('modal-piano').classList.remove('hidden')">+ NUOVO PIANO</button>
                    </div>
                    <div id="focus-piani" style="margin: 12px 0 25px 0;"></div>
                    
                    <strong style="font-size:12px;">DIARIO CLINICO</strong>
                    <textarea id="in-nota" placeholder="Inserisci un aggiornamento oggi..." style="height:80px; margin-top:10px; font-size: 14px !important;"></textarea>
                    <button class="btn-view" style="width:100%; padding: 12px;" onclick="aggiungiNota()">REGISTRA NOTA</button>
                    
                    <div id="focus-timeline" style="margin-top:25px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODALS -->
<div id="modal-pz" class="modal hidden">
    <div class="card" style="width:100%; max-width:400px;">
        <h2 id="modal-pz-titolo" style="margin-top:0; font-size:16px;">Anagrafica Paziente</h2>
        <input type="text" id="m-nome" placeholder="Nome e Cognome">
        <input type="text" id="m-cf" placeholder="Codice Fiscale">
        <input type="text" id="m-tel" placeholder="Recapito Telefonico">
        <input type="text" id="m-via" placeholder="Indirizzo Completo">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-view" style="flex:2" onclick="salvaAnagrafica()">CONFERMA</button>
            <button class="btn-del-outline" style="flex:1" onclick="chiudiTutto()">ANNULLA</button>
        </div>
    </div>
</div>

<div id="modal-diagnosi" class="modal hidden">
    <div class="card" style="width:100%; max-width:400px;">
        <h3 style="margin-top:0;">Nuova Diagnosi</h3>
        <input type="text" id="m-diag-nome" placeholder="Nome Patologia / Problema">
        <label style="font-size:10px; color:var(--zinc-400);">DATA DIAGNOSI</label>
        <input type="date" id="m-diag-data">
        <textarea id="m-diag-sintesi" placeholder="Breve sintesi clinica..." style="height:100px"></textarea>
        <button class="btn-view" style="width:100%" onclick="salvaDiagnosi()">AGGIUNGI DIAGNOSI</button>
        <button class="btn-del-outline" style="width:100%; margin-top:10px;" onclick="chiudiTutto()">CHIUDI</button>
    </div>
</div>

<div id="modal-piano" class="modal hidden">
    <div class="card" style="width:100%; max-width:400px;">
        <h3 style="margin-top:0;">Piano Terapeutico</h3>
        <textarea id="m-piano-testo" style="height:150px;" placeholder="Descrivi il piano di cura o i farmaci..."></textarea>
        <button class="btn-view" style="width:100%" onclick="salvaPiano()">SALVA PIANO</button>
        <button class="btn-del-outline" style="width:100%; margin-top:10px;" onclick="chiudiTutto()">ANNULLA</button>
    </div>
</div>

<!-- AREA DI STAMPA INVISIBILE -->
<div id="print-area"></div>

<script>
    let curPz = null; let curDiagIdx = null; let editMode = false;

    function showSection(id) {
        document.querySelectorAll('.main-content > div').forEach(s => s.classList.add('hidden'));
        document.getElementById('section-' + id).classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if(id==='dashboard') { renderDashboard(); document.getElementById('nav-dash').classList.add('active'); }
        if(id==='archivio') { renderArchivio(); document.getElementById('nav-arch').classList.add('active'); }
        window.scrollTo(0,0);
    }

    function salvaAnagrafica() {
        const n = document.getElementById('m-nome').value; if(!n) return;
        const d = { nome: n, cf: document.getElementById('m-cf').value, tel: document.getElementById('m-tel').value, via: document.getElementById('m-via').value };
        if(editMode) Object.assign(curPz, d);
        else {
            const id = "PZ-"+Date.now();
            curPz = { id, ...d, stato: 'attivo', dataApertura: new Date().toLocaleDateString(), diagnosi: [] };
        }
        localStorage.setItem(curPz.id, JSON.stringify(curPz));
        chiudiTutto();
        if(document.getElementById('section-clinica').classList.contains('hidden')) renderDashboard();
        else apriClinica(curPz.id);
    }

    function renderDashboard() {
        const tbody = document.getElementById('lista-attivi'); tbody.innerHTML = "";
        const keys = Object.keys(localStorage).filter(k => k.startsWith("PZ-")).sort().reverse();
        keys.forEach(k => {
            const p = JSON.parse(localStorage.getItem(k));
            if(p.stato === 'attivo') {
                tbody.innerHTML += `<tr>
                    <td>${p.dataApertura}</td>
                    <td><strong>${p.nome}</strong><br><small style="color:var(--zinc-400)">${p.cf}</small></td>
                    <td>
                        <button class="btn-view" onclick="apriClinica('${p.id}')">VISITA</button>
                        <button class="btn-del-outline" onclick="toggleStato('${p.id}')">ARCHIVIA</button>
                    </td>
                </tr>`;
            }
        });
    }

    function renderArchivio() {
        const q = document.getElementById('cercaArchivio').value.toLowerCase();
        const tbody = document.getElementById('lista-archiviati'); tbody.innerHTML = "";
        Object.keys(localStorage).filter(k => k.startsWith("PZ-")).forEach(k => {
            const p = JSON.parse(localStorage.getItem(k));
            if(p.stato === 'archiviato' && p.nome.toLowerCase().includes(q)) {
                tbody.innerHTML += `<tr>
                    <td><strong>${p.nome}</strong></td>
                    <td>
                        <button class="btn-view" onclick="apriClinica('${p.id}')">VEDI</button>
                        <button class="btn-view" style="background:var(--success)" onclick="toggleStato('${p.id}')">RIPRISTINA</button>
                        <button class="btn-del-outline" style="color:var(--danger)" onclick="eliminaDefinitivo('${p.id}')">ELIMINA</button>
                    </td>
                </tr>`;
            }
        });
    }

    function toggleStato(id) {
        let p = JSON.parse(localStorage.getItem(id));
        p.stato = (p.stato === 'attivo' ? 'archiviato' : 'attivo');
        localStorage.setItem(id, JSON.stringify(p));
        renderDashboard(); renderArchivio();
    }

    function eliminaDefinitivo(id) {
        if(confirm("Attenzione: l'eliminazione è definitiva. Procedere?")) {
            localStorage.removeItem(id);
            renderArchivio();
        }
    }

    function apriClinica(id) {
        curPz = JSON.parse(localStorage.getItem(id));
        showSection('clinica');
        document.getElementById('cli-nome').innerText = curPz.nome;
        document.getElementById('cli-info').innerText = `Codice Fiscale: ${curPz.cf}\nContatto: ${curPz.tel}\nIndirizzo: ${curPz.via}`;
        document.getElementById('area-focus').classList.add('hidden');
        curDiagIdx = null;
        renderDiagnosi();
    }

    function salvaDiagnosi() {
        const n = document.getElementById('m-diag-nome').value; if(!n) return;
        curPz.diagnosi.push({ 
            nome: n, 
            data: document.getElementById('m-diag-data').value || '--', 
            sintesi: document.getElementById('m-diag-sintesi').value || '',
            piani: [], diario: [] 
        });
        localStorage.setItem(curPz.id, JSON.stringify(curPz));
        chiudiTutto(); renderDiagnosi();
    }

    function renderDiagnosi() {
        const cont = document.getElementById('cli-lista-diag'); cont.innerHTML = "";
        curPz.diagnosi.forEach((d, i) => {
            const div = document.createElement('div');
            div.className = `diag-item ${curDiagIdx === i ? 'active' : ''}`;
            div.innerHTML = `
                <div class="diag-content">
                    <strong>${d.nome}</strong>
                    <div style="font-size:9px; color:var(--primary); margin-top:2px;">DATA: ${d.data}</div>
                    <div class="diag-sintesi">${d.sintesi}</div>
                </div>
                <span style="color:var(--zinc-400); margin-left:10px;">›</span>`;
            div.onclick = () => apriFocus(i);
            cont.appendChild(div);
        });
    }

    function apriFocus(idx) {
        curDiagIdx = idx;
        document.getElementById('area-focus').classList.remove('hidden');
        document.getElementById('focus-titolo').innerText = "DETTAGLI: " + curPz.diagnosi[idx].nome;
        renderDiagnosi(); renderPiani(); renderTimeline();
        if(window.innerWidth < 768) {
            setTimeout(() => { document.getElementById('area-focus').scrollIntoView({behavior: "smooth"}); }, 100);
        }
    }

    function salvaPiano() {
        const t = document.getElementById('m-piano-testo').value; if(!t) return;
        curPz.diagnosi[curDiagIdx].piani.unshift({ data: new Date().toLocaleDateString(), testo: t });
        localStorage.setItem(curPz.id, JSON.stringify(curPz));
        chiudiTutto(); renderPiani();
    }

    function renderPiani() {
        const cont = document.getElementById('focus-piani'); cont.innerHTML = "";
        curPz.diagnosi[curDiagIdx].piani.forEach((p, i) => {
            cont.innerHTML += `<div class="item-box">
                <button onclick="eliminaPiano(${i})" style="position:absolute; right:5px; top:5px; background:none; color:#ccc; font-size:14px;">×</button>
                <strong style="font-size:10px; color:var(--zinc-500)">${p.data}</strong><br>${p.testo}
            </div>`;
        });
    }

    function eliminaPiano(i) { curPz.diagnosi[curDiagIdx].piani.splice(i, 1); renderPiani(); }

    function aggiungiNota() {
        const t = document.getElementById('in-nota').value; if(!t) return;
        curPz.diagnosi[curDiagIdx].diario.unshift({ data: new Date().toLocaleString(), testo: t });
        document.getElementById('in-nota').value = "";
        renderTimeline();
    }

    function renderTimeline() {
        const cont = document.getElementById('focus-timeline'); cont.innerHTML = "";
        curPz.diagnosi[curDiagIdx].diario.forEach((n, i) => {
            cont.innerHTML += `<div class="timeline-item">
                <button onclick="eliminaNota(${i})" style="position:absolute; right:0; top:0; background:none; color:#ccc;">×</button>
                <small style="color:var(--primary); font-weight:bold; font-size:10px;">${n.data}</small><br>
                <div style="margin-top:4px;">${n.testo}</div>
            </div>`;
        });
    }

    function eliminaNota(i) { curPz.diagnosi[curDiagIdx].diario.splice(i, 1); renderTimeline(); }

    function chiudiTutto() { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }
    
    function salvaEChiudi() { 
        localStorage.setItem(curPz.id, JSON.stringify(curPz));
        const btn = document.getElementById('btnSalvaTutto');
        btn.innerText = "✅ SALVATO";
        setTimeout(() => { btn.innerText = "💾 SALVA"; showSection('dashboard'); }, 600);
    }

    function apriModalPaziente(edit) {
        editMode = edit;
        document.getElementById('modal-pz-titolo').innerText = edit ? "Modifica Cartella" : "Nuova Cartella Clinica";
        if(!edit) ['m-nome','m-cf','m-tel','m-via'].forEach(id => document.getElementById(id).value="");
        else {
            document.getElementById('m-nome').value = curPz.nome;
            document.getElementById('m-cf').value = curPz.cf;
            document.getElementById('m-tel').value = curPz.tel;
            document.getElementById('m-via').value = curPz.via;
        }
        document.getElementById('modal-pz').classList.remove('hidden');
    }

    // FUNZIONE STAMPA OTTIMIZZATA
    function generaStampa() {
        const printArea = document.getElementById('print-area');
        let content = `
            <div style="padding:40px; font-family: sans-serif; color:#333;">
                <div style="text-align:right; color:#888; font-size:12px;">MEDPRO v16.1 - Report Clinico</div>
                <h1 style="border-bottom: 2px solid #2563eb; padding-bottom:10px;">${curPz.nome}</h1>
                <p><strong>CF:</strong> ${curPz.cf} | <strong>Tel:</strong> ${curPz.tel}</p>
                <p><strong>Indirizzo:</strong> ${curPz.via}</p>
                <hr style="border:none; border-top: 1px solid #eee; margin:20px 0;">
        `;

        curPz.diagnosi.forEach(d => {
            content += `
                <div style="margin-bottom:30px; page-break-inside: avoid;">
                    <h2 style="background:#f4f4f5; padding:8px; font-size:18px;">Patologia: ${d.nome}</h2>
                    <p><em>Diagnosi del: ${d.data}</em></p>
                    <p><strong>Sintesi:</strong> ${d.sintesi}</p>
                    
                    <h3>Piani Terapeutici:</h3>
                    ${d.piani.length ? d.piani.map(p => `<div style="margin-bottom:8px;"><strong>${p.data}:</strong> ${p.testo}</div>`).join('') : 'Nessun piano registrato.'}
                    
                    <h3>Diario Clinico:</h3>
                    ${d.diario.length ? d.diario.map(n => `<div style="border-left:2px solid #2563eb; padding-left:10px; margin-bottom:10px;"><strong>${n.data}:</strong><br>${n.testo}</div>`).join('') : 'Nessuna nota presente.'}
                </div>
            `;
        });

        content += `</div>`;
        printArea.innerHTML = content;
        
        // Esegue la stampa nativa del sistema
        window.print();
        
        // Pulisce l'area dopo la stampa per non lasciare residui visibili
        setTimeout(() => { printArea.innerHTML = ""; }, 1000);
    }

    window.onload = () => renderDashboard();
</script>

</body>
</html>
