<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MEDPRO v16.1 | Clinical Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary: #1e40af; --success: #15803d; --danger: #b91c1c;
            --zinc-50: #f8fafc; --zinc-100: #f1f5f9; --zinc-200: #e2e8f0;
            --zinc-500: #64748b; --zinc-800: #1e293b; --border: #cbd5e1; --text: #0f172a;
        }

        body { 
            font-family: 'Inter', -apple-system, system-ui, sans-serif; 
            background: var(--zinc-50); margin: 0; display: flex; color: var(--text); 
            font-size: 14px; line-height: 1.5; min-height: 100vh;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        
        /* SCHERMATA LOGIN */
        #login-screen {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--zinc-100);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }

        /* SIDEBAR */
        .sidebar { 
            width: 220px; background: var(--zinc-800); color: white; 
            height: 100vh; position: fixed; display: flex; flex-direction: column; z-index: 100; 
        }
        .sidebar-header { padding: 25px 20px; display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 35px; height: 35px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; font-size: 20px; }
        .nav-btn { padding: 15px 20px; cursor: pointer; color: #94a3b8; border:none; background:none; width:100%; text-align:left; font-size: 14px; transition: 0.2s; }
        .nav-btn.active { background: #334155; color: white; border-left: 4px solid var(--primary); }

        /* MAIN CONTENT */
        .main-content { margin-left: 220px; padding: 30px; width: 100%; box-sizing: border-box; }
        .card { background: white; border: 1px solid var(--zinc-200); border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .clinica-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
        
        .diag-item { padding: 12px; border: 1px solid var(--zinc-200); border-radius: 10px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; background: white; transition: 0.2s; }
        .diag-item.active { border-color: var(--primary); background: #f0f7ff; box-shadow: inset 4px 0 0 var(--primary); }
        
        button { padding: 10px 15px; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; }
        .btn-icon { padding: 8px; background: #f1f5f9; color: var(--zinc-800); font-size: 16px; min-width: 38px; }
        .btn-view { background: var(--primary); color: white; }
        .btn-del { background: var(--danger); color: white; }

        input, textarea { font-size: 16px !important; padding: 12px; border: 1px solid var(--zinc-200); border-radius: 10px; width: 100%; margin-bottom: 12px; box-sizing: border-box; font-family: inherit; }
        
        .pazienti-table { width: 100%; border-collapse: collapse; }
        .pazienti-table th { text-align: left; padding: 12px; font-size: 11px; color: var(--zinc-500); text-transform: uppercase; border-bottom: 2px solid var(--zinc-100); }
        .pazienti-table td { padding: 10px 12px; border-bottom: 1px solid var(--zinc-100); }

        .piano-box { border: 1px solid var(--zinc-200); border-radius: 12px; padding: 15px; margin-bottom: 15px; background: #fff; }
        .banner-diario { background: #f8fafc; border-top: 1px solid var(--zinc-200); border-radius: 0 0 12px 12px; padding: 15px; margin: 15px -15px -15px -15px; }
        .nota-item { background: white; border-radius: 8px; padding: 10px; margin-top: 8px; border: 1px solid var(--zinc-200); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px; box-sizing: border-box; }
        .hidden { display: none !important; }

        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: sticky; top: 0; flex-direction: row; padding: 5px 0; padding-top: env(safe-area-inset-top); }
            .sidebar-header { display: none; }
            .nav-btn { width: auto; padding: 10px; border-left: none; }
            .nav-btn.active { border-bottom: 3px solid var(--primary); }
            .main-content { margin-left: 0; padding: 15px; }
            .clinica-grid { grid-template-columns: 1fr; }
        }

        #print-section { display: none; }

        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { 
                display: block !important; 
                position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; margin: 0;
            }
            .sidebar, .nav-btn, button, .modal, .main-content { display: none !important; }
        }
    </style>
</head>
<body>

<!-- SCHERMATA LOGIN -->
<div id="login-screen">
    <div class="card" style="width:100%; max-width:350px; padding: 25px;">
        <h2 style="text-align:center; margin-top:0; color:var(--primary)">MEDPRO Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button class="btn-view" style="width:100%;" onclick="handleLogin()">ACCEDI</button>
        <p id="login-error" style="color:var(--danger); text-align:center; margin-top:15px; font-size:12px; margin-bottom:0;"></p>
    </div>
</div>

<!-- APPLICATIVO PRINCIPALE -->
<div class="sidebar">
    <div class="sidebar-header"><div class="logo-box">M</div><h2>MEDPRO</h2></div>
    <button class="nav-btn active" onclick="showSection('dashboard')" id="nav-dash">📋 In Cura</button>
    <button class="nav-btn" onclick="showSection('archivio')" id="nav-arch">📂 Archivio</button>
    <button class="nav-btn" onclick="handleLogout()" style="margin-top:auto; color:var(--danger)">🚪 Esci</button>
</div>

<div class="main-content">
    <div id="section-dashboard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
            <h1>Dashboard</h1>
            <button class="btn-view" style="background: var(--success);" onclick="apriModalPaziente(false)">+ NUOVO</button>
        </div>
        <div class="card" style="padding:0; overflow-x: auto;">
            <table class="pazienti-table">
                <thead><tr><th>Data</th><th>Nominativo</th><th>Azioni</th></tr></thead>
                <tbody id="lista-attivi"></tbody>
            </table>
        </div>
    </div>

    <div id="section-archivio" class="hidden">
        <h1>Archivio Storico</h1>
        <input type="text" id="cercaArchivio" placeholder="🔍 Cerca paziente..." onkeyup="renderArchivio()">
        <div class="card" style="padding:0; overflow-x: auto;">
            <table class="pazienti-table">
                <thead><tr><th>Nominativo</th><th>Azioni</th></tr></thead>
                <tbody id="lista-archiviati"></tbody>
            </table>
        </div>
    </div>

    <div id="section-clinica" class="hidden">
        <div style="display:flex; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 8px;">
            <button onclick="showSection('dashboard')" class="btn-del" style="background:var(--zinc-500)">← ESCI</button>
            <div style="display:flex; gap:8px;">
                <button id="btn-ripristina-clinica" class="btn-view hidden" style="background:var(--success)" onclick="toggleStato(curPz.id, true)">RIPRISTINA</button>
                <button class="btn-view" style="background:var(--danger)" onclick="generaStampa()">📄 STAMPA</button>
                <button class="btn-view" style="background:var(--zinc-800)" onclick="salvaEChiudi()">💾 SALVA</button>
            </div>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items: center;">
                <div>
                    <h2 id="cli-nome" style="margin:0; font-size: 20px; display: inline-block;">--</h2>
                    <button onclick="apriModalPaziente(true)" class="btn-icon">⚙️</button>
                    <p id="cli-info" style="color:var(--zinc-500); white-space: pre-line; margin-top:5px; font-size:12px;"></p>
                </div>
            </div>
        </div>
        <div class="clinica-grid">
            <div>
                <h3>Diagnosi</h3>
                <button class="btn-view" style="width:100%; margin-bottom:15px;" onclick="document.getElementById('modal-diagnosi').classList.remove('hidden')">+ AGGIUNGI</button>
                <div id="cli-lista-diag"></div>
            </div>
            <div id="area-focus" class="hidden">
                <div class="card" style="border-top: 4px solid var(--primary);">
                    <h2 id="focus-titolo" style="margin-bottom:5px;">--</h2>
                    <div id="focus-sintesi" style="background:var(--zinc-100); padding:10px; border-radius:8px; margin-bottom:20px; font-style:italic; color:var(--zinc-800); border-left: 3px solid var(--zinc-500);"></div>
                    
                    <button class="btn-view" style="margin-bottom:15px;" onclick="document.getElementById('modal-piano').classList.remove('hidden')">+ NUOVO PIANO</button>
                    <div id="focus-imbuto"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="print-section"></div>

<!-- MODALS -->
<div id="modal-pz" class="modal hidden">
    <div class="card" style="width:100%; max-width:400px;">
        <h2>Anagrafica</h2>
        <input type="text" id="m-nome" placeholder="Nome e Cognome">
        <input type="text" id="m-nascita" placeholder="Data Nascita (gg/mm/aaaa)">
        <input type="text" id="m-via" placeholder="Indirizzo">
        <input type="text" id="m-cf" placeholder="Codice Fiscale">
        <input type="text" id="m-tel" placeholder="Telefono">
        <input type="email" id="m-email" placeholder="Email">
        <button class="btn-view" style="width:100%" onclick="salvaAnagrafica()">SALVA</button>
        <button class="btn-del" style="width:100%; margin-top:8px;" onclick="chiudiTutto()">CHIUDI</button>
    </div>
</div>

<div id="modal-diagnosi" class="modal hidden">
    <div class="card" style="width:100%; max-width:400px;">
        <h3>Nuova Diagnosi</h3>
        <input type="text" id="m-diag-nome" placeholder="Patologia">
        <input type="text" id="m-diag-data" placeholder="Data (gg/mm/aaaa)">
        <textarea id="m-diag-sintesi" placeholder="Note..."></textarea>
        <button class="btn-view" style="width:100%" onclick="salvaDiagnosi()">SALVA</button>
        <button class="btn-del" style="width:100%; margin-top:8px;" onclick="chiudiTutto()">CHIUDI</button>
    </div>
</div>

<div id="modal-piano" class="modal hidden">
    <div class="card" style="width:100%; max-width:400px;">
        <h3>Nuovo Piano</h3>
        <input type="text" id="m-piano-data" placeholder="Data (gg/mm/aaaa)">
        <textarea id="m-piano-testo" placeholder="Dettagli..."></textarea>
        <button class="btn-view" style="width:100%" onclick="salvaPiano()">CREA</button>
        <button class="btn-del" style="width:100%; margin-top:8px;" onclick="chiudiTutto()">ANNULLA</button>
    </div>
</div>

<!-- SCRIPTS INTEGRATI FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRg-aZUHKF0SyrxBT4vgDqHK6LuGVAnZ8",
        authDomain: "medpro16-11124.firebaseapp.com",
        projectId: "medpro16-11124",
        storageBucket: "medpro16-11124.firebasestorage.app",
        messagingSenderId: "818669381026",
        appId: "1:818669381026:web:c96bb4f71ede703c97befb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let elencoPazientiCache = [];
    
    window.curPz = null;
    window.curDiagIdx = null;
    window.editMode = false;
    window.openDiarioIdx = null;

    // ---- FUNZIONI AUTH ----
    window.handleLogin = async () => {
        const emailEl = document.getElementById('login-email');
        const passEl = document.getElementById('login-password');
        
        if (!emailEl || !passEl) return;

        const email = emailEl.value.trim();
        const pass = passEl.value;

        if (!email || !pass) return alert("Inserisci email e password.");

        try {
            document.getElementById('login-error').innerText = "Accesso in corso...";
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
            alert("Credenziali errate o utente non configurato su Firebase.");
            document.getElementById('login-error').innerText = "Accesso fallito. Riprova.";
        }
    };

    window.handleLogout = () => {
        signOut(auth).catch((err) => alert("Errore disconnessione: " + err.message));
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            await syncDatiDaFirebase();
            window.showSection('dashboard');
        } else {
            currentUser = null;
            elencoPazientiCache = [];
            document.getElementById('login-screen').classList.remove('hidden');
        }
    });

    // ---- DATA SYNC DATABASE ----
    async function syncDatiDaFirebase() {
        if (!currentUser) return;
        try {
            const q = query(collection(db, "pazienti"), where("userId", "==", currentUser.uid));
            const querySnapshot = await getDocs(q);
            elencoPazientiCache = [];
            querySnapshot.forEach((doc) => {
                elencoPazientiCache.push(doc.data());
            });
        } catch(e) {
            alert("Errore caricamento database:\n" + e.message);
        }
    }

    async function salvaPazienteSuCloud(pazienteObj) {
        if(!currentUser) return;
        try {
            pazienteObj.userId = currentUser.uid;
            // Bug corretto: cambiato da pacienteObj a pazienteObj
            await setDoc(doc(db, "pazienti", pazienteObj.id), pazienteObj);
            await syncDatiDaFirebase();
        } catch (error) {
            alert("Errore di salvataggio su Firebase:\n" + error.message + "\n\nVerifica le Regole (Rules) del database.");
            throw error;
        }
    }

    // ---- LOGICA APPLICATIVA ----
    window.chiudiTutto = () => { document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden')); }

    window.showSection = async (id) => {
        document.querySelectorAll('.main-content > div').forEach(s => s.classList.add('hidden'));
        const section = document.getElementById('section-' + id);
        if (section) section.classList.remove('hidden');
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if(id==='dashboard') window.renderDashboard();
        if(id==='archivio') window.renderArchivio();
    }

    window.salvaAnagrafica = async () => {
        const nome = document.getElementById('m-nome').value.trim();
        const cf = document.getElementById('m-cf').value.trim();
        if(!nome || !cf) return alert("Nome e CF sono obbligatori.");
        
        let dati = { nome, cf, nascita: document.getElementById('m-nascita').value, via: document.getElementById('m-via').value, tel: document.getElementById('m-tel').value, email: document.getElementById('m-email').value };
        
        if(window.editMode) {
            Object.assign(window.curPz, dati);
        } else { 
            const id = "PZ-" + Date.now(); 
            window.curPz = { id, ...dati, stato: 'attivo', dataApertura: new Date().toLocaleDateString(), diagnosi: [] }; 
        }
        
        try {
            await salvaPazienteSuCloud(window.curPz);
            window.chiudiTutto(); 
            window.renderDashboard();
        } catch (e) {
            // L'errore viene già gestito con alert dentro salvaPazienteSuCloud
        }
    }

    window.renderDashboard = () => {
        const tbody = document.getElementById('lista-attivi'); tbody.innerHTML = "";
        elencoPazientiCache.filter(p => p.stato === 'attivo').forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${p.dataApertura}</td><td><strong>${p.nome}</strong></td>
            <td><button class="btn-icon" id="view-${p.id}">👁️</button>
            <button class="btn-icon" id="tog-${p.id}">📂</button></td>`;
            tbody.appendChild(tr);

            document.getElementById(`view-${p.id}`).onclick = () => window.apriClinica(p.id);
            document.getElementById(`tog-${p.id}`).onclick = () => window.toggleStato(p.id);
        });
    }

    window.renderArchivio = () => {
        const q = document.getElementById('cercaArchivio').value.toLowerCase();
        const tbody = document.getElementById('lista-archiviati'); tbody.innerHTML = "";
        elencoPazientiCache.filter(p => p.stato === 'archiviato' && p.nome.toLowerCase().includes(q)).forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><strong>${p.nome}</strong></td>
            <td><button class="btn-icon" id="archview-${p.id}">👁️</button>
            <button class="btn-icon" id="archi-tog-${p.id}">🔄</button>
            <button class="btn-icon" style="color:var(--danger)" id="del-${p.id}">🗑️</button></td>`;
            tbody.appendChild(tr);

            document.getElementById(`archview-${p.id}`).onclick = () => window.apriClinica(p.id);
            document.getElementById(`archi-tog-${p.id}`).onclick = () => window.toggleStato(p.id);
            document.getElementById(`del-${p.id}`).onclick = () => window.eliminaDefinitivo(p.id);
        });
    }

    window.toggleStato = async (id, forceOpen=false) => {
        let p = elencoPazientiCache.find(x => x.id === id);
        p.stato = (p.stato === 'attivo' ? 'archiviato' : 'attivo');
        await salvaPazienteSuCloud(p);
        forceOpen ? window.apriClinica(id) : window.showSection('dashboard');
    }

    window.eliminaDefinitivo = async (id) => {
        if(confirm("Eliminare definitivamente questo record dal cloud?")) { 
            await deleteDoc(doc(db, "pazienti", id));
            await syncDatiDaFirebase();
            window.renderArchivio(); 
        } 
    }

    window.apriClinica = (id) => {
        window.curPz = elencoPazientiCache.find(x => x.id === id); 
        window.showSection('clinica');
        document.getElementById('cli-nome').innerText = window.curPz.nome;
        document.getElementById('cli-info').innerText = `Nascita: ${window.curPz.nascita}\nCF: ${window.curPz.cf}\nTel: ${window.curPz.tel}`;
        document.getElementById('btn-ripristina-clinica').className = window.curPz.stato==='archiviato' ? 'btn-view' : 'hidden';
        document.getElementById('area-focus').classList.add('hidden'); 
        window.renderDiagnosi();
    }

    window.salvaDiagnosi = async () => {
        window.curPz.diagnosi.push({ 
            nome: document.getElementById('m-diag-nome').value, 
            data: document.getElementById('m-diag-data').value || '--', 
            sintesi: document.getElementById('m-diag-sintesi').value, 
            piani: [] 
        });
        await salvaPazienteSuCloud(window.curPz);
        
        document.getElementById('m-diag-nome').value = "";
        document.getElementById('m-diag-data').value = "";
        document.getElementById('m-diag-sintesi').value = "";
        window.chiudiTutto(); 
        window.renderDiagnosi();
    }

    window.renderDiagnosi = () => {
        const cont = document.getElementById('cli-lista-diag'); cont.innerHTML = "";
        window.curPz.diagnosi.forEach((d, i) => {
            const row = document.createElement('div');
            row.className = `diag-item ${window.curDiagIdx===i?'active':''}`;
            row.innerHTML = `<div style="flex:1;" id="focus-click-${i}"><strong>${d.nome}</strong><br><small>${d.data}</small></div>
            <button id="del-diag-${i}" style="background:none; border:none; font-size:20px;">&times;</button>`;
            cont.appendChild(row);

            document.getElementById(`focus-click-${i}`).onclick = () => window.apriFocus(i);
            document.getElementById(`del-diag-${i}`).onclick = () => window.eliminaDiagnosi(i);
        });
    }

    window.eliminaDiagnosi = async (idx) => { if(confirm("Eliminare la diagnosi?")) { window.curPz.diagnosi.splice(idx, 1); await window.salvaEChiudi(true); } }

    window.apriFocus = (idx) => {
        window.curDiagIdx = idx; 
        document.getElementById('area-focus').classList.remove('hidden');
        const diag = window.curPz.diagnosi[idx];
        document.getElementById('focus-titolo').innerText = diag.nome;
        
        const sBox = document.getElementById('focus-sintesi');
        sBox.innerText = diag.sintesi ? "Note Diagnosi: " + diag.sintesi : "Nessuna nota inserita per questa diagnosi.";
        window.renderImbuto();
    }

    window.salvaPiano = async () => {
        window.curPz.diagnosi[window.curDiagIdx].piani.unshift({ testo: document.getElementById('m-piano-testo').value, data: document.getElementById('m-piano-data').value || '--', diario: [] });
        await salvaPazienteSuCloud(window.curPz); 
        window.chiudiTutto(); 
        window.renderImbuto();
    }

    window.toggleDiarioBanner = (pIdx) => { window.openDiarioIdx = (window.openDiarioIdx === pIdx) ? null : pIdx; window.renderImbuto(); }

    window.renderImbuto = () => {
        const cont = document.getElementById('focus-imbuto'); cont.innerHTML = "";
        window.curPz.diagnosi[window.curDiagIdx].piani.forEach((p, pIdx) => {
            const isDiarioOpen = window.openDiarioIdx === pIdx;
            let html = `<div class="piano-box">
                <button id="del-piano-${pIdx}" style="float:right; background:none; border:none;">&times;</button>
                <strong>PIANO DEL: ${p.data}</strong><p style="margin:8px 0;">${p.testo}</p>
                <button id="tog-dia-${pIdx}" class="btn-view" style="background:${isDiarioOpen?'var(--zinc-800)':'var(--primary)'}">${isDiarioOpen ? 'CHIUDI' : '📋 DIARIO'}</button>
                <div class="banner-diario ${isDiarioOpen ? '' : 'hidden'}">
                    <div style="display:flex; gap:8px; flex-direction:column;">
                        <input type="text" id="date-nota-${pIdx}" placeholder="Data (gg/mm/aaaa)">
                        <textarea id="in-nota-${pIdx}" placeholder="Nota..."></textarea>
                        <button id="add-nota-${pIdx}" class="btn-view" style="background:var(--success)">OK</button>
                    </div>
                    <div id="diario-list-${pIdx}">`;
            p.diario.forEach((n, nIdx) => {
                html += `<div class="nota-item"><button id="del-nota-${pIdx}-${nIdx}" style="float:right; background:none; border:none;">&times;</button>
                <small><strong>${n.data}</strong></small><br>${n.testo}</div>`;
            });
            html += `</div></div></div>`;
            
            const wrap = document.createElement('div');
            wrap.innerHTML = html;
            cont.appendChild(wrap);

            document.getElementById(`del-piano-${pIdx}`).onclick = () => window.eliminaPiano(pIdx);
            document.getElementById(`tog-dia-${pIdx}`).onclick = () => window.toggleDiarioBanner(pIdx);
            if(isDiarioOpen){
                document.getElementById(`add-nota-${pIdx}`).onclick = () => window.aggiungiNota(pIdx);
                p.diario.forEach((n, nIdx) => {
                    document.getElementById(`del-nota-${pIdx}-${nIdx}`).onclick = () => window.eliminaNota(pIdx, nIdx);
                });
            }
        });
    }

    window.aggiungiNota = async (pIdx) => {
        const t = document.getElementById('in-nota-' + pIdx).value;
        const d = document.getElementById('date-nota-' + pIdx).value || '--';
        if(!t) return; 
        window.curPz.diagnosi[window.curDiagIdx].piani[pIdx].diario.unshift({ data: d, testo: t });
        await salvaPazienteSuCloud(window.curPz); 
        window.renderImbuto();
    }

    window.eliminaPiano = async (idx) => { if(confirm("Eliminare questo piano?")) { window.curPz.diagnosi[window.curDiagIdx].piani.splice(idx, 1); await window.salvaEChiudi(true); window.renderImbuto(); } }
    window.eliminaNota = async (pIdx, nIdx) => { if(confirm("Eliminare questa nota?")) { window.curPz.diagnosi[window.curDiagIdx].piani[pIdx].diario.splice(nIdx, 1); await window.salvaEChiudi(true); window.renderImbuto(); } }
    
    window.salvaEChiudi = async (keep=false) => { 
        await salvaPazienteSuCloud(window.curPz); 
        if(!keep) window.showSection('dashboard'); else window.renderDiagnosi(); 
    }
    
    window.apriModalPaziente = (edit) => {
        window.editMode = edit;
        if(edit) {
            document.getElementById('m-nome').value = window.curPz.nome; document.getElementById('m-cf').value = window.curPz.cf;
            document.getElementById('m-nascita').value = window.curPz.nascita; document.getElementById('m-via').value = window.curPz.via;
            document.getElementById('m-tel').value = window.curPz.tel; document.getElementById('m-email').value = window.curPz.email;
        } else { ['m-nome','m-nascita','m-via','m-cf','m-tel','m-email'].forEach(id => document.getElementById(id).value=""); }
        document.getElementById('modal-pz').classList.remove('hidden');
    }

    window.generaStampa = () => {
        if(!window.curPz) return;
        const printSection = document.getElementById('print-section');
        let html = `<div style="font-family: sans-serif; padding: 40px; color: #000; line-height: 1.5; background: #fff;">
            <div style="border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 30px;">
                <h1 style="margin:0; text-transform: uppercase;">Cartella Clinica</h1>
                <p style="margin:0; font-size: 12px;">Sistema MEDPRO v16.1 | Report del ${new Date().toLocaleDateString()}</p>
            </div>
            <div style="border: 1px solid #ccc; background: #f9f9f9; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px;">
                <div><strong>Paziente:</strong> ${window.curPz.nome}<br><strong>Data Nascita:</strong> ${window.curPz.nascita || '--'}<br><strong>CF:</strong> ${window.curPz.cf || '--'}</div>
                <div><strong>Telefono:</strong> ${window.curPz.tel || '--'}<br><strong>Email:</strong> ${window.curPz.email || '--'}<br><strong>Indirizzo:</strong> ${window.curPz.via || '--'}</div>
            </div>`;

        if (window.curPz.diagnosi) {
            window.curPz.diagnosi.forEach(d => {
                html += `<div style="margin-bottom: 30px; page-break-inside: avoid; border-bottom: 1px solid #eee; padding-bottom: 20px;">
                    <div style="background: #eee; padding: 8px; font-weight: bold; margin-bottom: 10px;">PATOLOGIA: ${d.nome} (${d.data})</div>
                    <p><strong>Note Diagnosi:</strong> ${d.sintesi || '--'}</p>`;
                if (d.piani) d.piani.forEach(p => {
                    html += `<div style="margin-left: 20px; border-left: 2px solid #333; padding-left: 15px; margin-top: 15px;">
                        <div style="font-weight: bold; text-decoration: underline;">Piano Terapeutico del ${p.data}</div>
                        <p style="margin: 5px 0;">${p.testo}</p>`;
                    if (p.diario) p.diario.forEach(n => {
                        html += `<div style="font-size: 12px; margin-top: 5px; border-top: 1px solid #f1f1f1;"><strong>${n.data}:</strong> ${n.testo}</div>`;
                    });
                    html += `</div>`;
                });
                html += `</div>`;
            });
        }
        printSection.innerHTML = html + `</div>`;
        setTimeout(() => { window.print(); }, 300);
    }
</script>
</body>
</html>
